name: CI

on:
  push:
    branches: [main, feature/madar-complete-upgrade]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hrms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hrms_test?schema=public
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/hrms_test?schema=public
      AUTH_SECRET: ci-secret-change-me
      NEXTAUTH_SECRET: ci-secret-change-me
      NEXTAUTH_URL: http://localhost:3000
      APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # package-lock.json is committed and kept in sync with package.json --
      # it was previously removed (see d19e62f) after drifting out of sync
      # with package.json caused npm ci to fail, which let dependency
      # versions float uncontrolled between Vercel builds (root cause of
      # several "works locally, breaks on Vercel" production crashes).
      # Regenerated fresh; keep both files in sync going forward by running
      # npm install (not npm install --no-save) whenever adding a dependency.
      - run: npm install
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - name: Inspect migration-to-schema differences (no database changes)
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --script

      - name: Verify application workflows with fixtures
        run: node --experimental-vm-modules --test tests/auth/*.test.mjs tests/attendance/*.test.mjs tests/payroll/*.test.mjs tests/recruitment/*.test.mjs tests/workflows/*.test.mjs tests/odoo-requests/*.test.mjs tests/odoo-migration/*.test.mjs tests/odoo/*.test.mjs
      - name: Verify actual database workflow and payroll settlement
        env:
          SELF_SERVICE_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hrms_test?schema=public
          PAYROLL_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/hrms_test?schema=public
        run: |
          node --experimental-vm-modules tests/workflows/self-service.integration.mjs
          node --experimental-vm-modules tests/payroll/settlement.integration.mjs
      - name: Verify tabular export files
        run: node --import tsx --test tests/exports/*.integration.mjs
      - run: npm run lint
      - name: TypeScript validation
        run: npm run typecheck
      - run: npm run build
      - name: Install Chromium for isolated browser acceptance
        run: npx playwright install --with-deps chromium
      - name: Verify actual login and MADAR task lifecycle in desktop/mobile browser
        env:
          SMOKE_BASE_URL: http://localhost:3000
          MADAR_SMOKE_PASSWORD: ci-only-madar-browser-pass
          CRON_SECRET: ci-only-madar-cron-secret
          AUTH_TRUST_HOST: "true"
        run: |
          set -euo pipefail
          node tests/smoke/madar-ci-seed.mjs
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/madar-ci-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/login >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://localhost:3000/login >/dev/null
          npm run test:smoke -- madar-tasks.spec.ts
